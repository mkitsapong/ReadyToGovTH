<!doctype html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReadyToGovTH - ศูนย์รวมประกาศรับสมัครงานราชการ พนักงานราชการ และรัฐวิสาหกิจ</title>
  
  <meta name="theme-color" content="#0f172a" />
  <link rel="apple-touch-icon" href="/pwa-192x192.png" />
  <script>
    (function() {
      try {
        var saved = localStorage.getItem("readytogov_theme");
        var theme = saved === "dark" || saved === "light" ? saved : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
        if (theme === "dark") document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = theme;
      } catch (e) {}
    })();
  </script>
  <!-- Fonts are bundled locally via @fontsource/prompt & @fontsource/plus-jakarta-sans -->
  <!-- SEO Tags are injected dynamically by React Helmet Async -->
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
